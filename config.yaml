# config.yaml - 3D打印异常检测系统配置文件
# ============================================================
# 配置文件使用说明：
# 1. 修改配置后需要重启程序
# 2. # 开头的为注释行
# 3. 缩进必须使用空格，不能使用Tab
# ============================================================

# ───────────── 调试模式 ─────────────
# 视频测试模式：填入视频路径后，不调用摄像头，直接识别视频
# 为空时使用摄像头实时检测
debug:
  video_path: "C:\\Files\\Projects\\3D-printing-defects\\test-demo\\test1.mp4"   # 视频文件路径，为空使用摄像头
  frame_interval: 120                     # 每隔多少帧识别一次（1=每帧都识别）

# ───────────── 模型配置 ─────────────
model:
  path: "best.pt"                    # YOLO 模型文件路径
  conf_threshold: 0.3                # 常规检测置信度阈值 (0.0-1.0)
  alert_conf_threshold: 0.8         # 报警置信度阈值 (0.0-1.0)
  spaghetti_area_threshold: 900     # 炒面告警面积阈值(像素²)，小于此值不告警
  use_cuda: true                     # 是否启用CUDA加速

# ───────────── 摄像头配置 ─────────────
camera:
  index: 0                           # 摄像头索引 (0为默认摄像头)
  width: 640                         # 分辨率宽度
  height: 480                       # 分辨率高度
  warmup_frames: 8                  # 预热帧数 (自动曝光/白平衡稳定)
  max_captured: 1                   # captured目录保留最新图片数量，0=保留全部
  max_predicted: 1                  # predicted目录保留最新图片数量，0=保留全部

# ───────────── 监控配置 ─────────────
monitoring:
  interval_sec: 3                    # 检测间隔（秒）

# ───────────── 目录配置 ─────────────
directories:
  project_root: ".."                 # 项目根目录
  predicted_dir: "images/predicted"  # 预测图片保存目录
  captured_dir: "images/captured"    # 原始图片保存目录

# ───────────── 邮件报警配置 ─────────────
email:
  enabled: true                      # 是否启用邮件报警
  to: "geekelement@outlook.com"     # 接收邮件地址
  from: "geekelement@foxmail.com"   # 发送邮件地址
  password: "uxdrpmvghbffdbbj"       # 授权码/应用密码
  smtp:
    server: "smtp.qq.com"            # SMTP服务器
    port: 465                        # SMTP端口
    use_ssl: true                    # 是否使用SSL
  imap:
    server: "imap.qq.com"            # IMAP服务器（用于接收回复）
    check_interval: 10               # 检查间隔（秒）

# ───────────── 邮件回复控制 ─────────────
email_reply:
  enabled: true                      # 是否启用邮件回复处理
  subject_prefix: "【3D打印异常警报】"  # 告警邮件主题标识
  skip_duration_min: 10              # 回复后跳过检测时长（分钟）

# ───────────── 打印机远程控制 ─────────────
printer:
  # 打印机固件类型: klipper, octoprint, bambu, none
  # 选择对应固件后，需填写下方对应的配置
  type: "bambu"

  # Klipper 配置 (type: klipper)
  klipper:
    url: "http://192.168.9.99:7125"  # Moonraker服务器地址
    api_key: ""                       # API密钥（可选）

  # OctoPrint 配置 (type: octoprint)
  octoprint:
    url: "http://192.168.1.100:5000" # OctoPrint服务器地址
    api_key: ""                       # API密钥

  # Bambu Lab 配置 (type: bambu)
  bambu:
    host: "192.168.1.100"             # 打印机IP地址
    mqtt_port: 8883                   # MQTT端口 (8883=SSL, 1883=非SSL)
    access_code: ""                   # 访问代码
    serial_number: ""                 # 打印机序列号

# ───────────── 程序设置 ─────────────
app:
  name: "3D打印异常检测系统"
  log_level: "INFO"                   # 日志级别: DEBUG, INFO, WARNING, ERROR