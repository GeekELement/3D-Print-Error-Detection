# config.yaml - 3D打印异常检测系统配置文件
# 配置文件使用说明：
# 1. 修改配置后需要重启程序
# 2. # 开头的为注释行
# 3. 缩进必须使用空格，不能使用Tab

# ───────────── 模型配置 ─────────────
model:
  # YOLO 模型文件路径
  path: "yolov8n.pt"
  # YOLO 常规检测置信度阈值 (0.0-1.0)
  conf_threshold: 0.25
  # 报警置信度阈值 (0.0-1.0)
  alert_conf_threshold: 0.70

# ───────────── 摄像头配置 ─────────────
camera:
  # 摄像头索引 (0为默认摄像头)
  index: 0
  # 摄像头分辨率 - 宽度
  width: 640
  # 摄像头分辨率 - 高度
  height: 480
  # 摄像头预热帧数 (用于自动曝光/白平衡稳定)
  warmup_frames: 8

# ───────────── 监控配置 ─────────────
monitoring:
  # 检测间隔（分钟）
  interval_min: 0.1

# ───────────── 目录配置 ─────────────
directories:
  # 项目根目录（相对于此配置文件的目录）
  project_root: ".."
  # 预测图片保存目录（相对于项目根目录）
  predicted_dir: "images/predicted_pictures"
  # 原始图片保存目录（相对于项目根目录）
  captured_dir: "images/saved_pictures"

# ───────────── 邮件报警配置 ─────────────
email:
  # 是否启用邮件报警
  enabled: true
  # 接收邮件地址
  to: "geekelement@outlook.com"
  # 发送邮件地址
  from: "geekelement@foxmail.com"
  # 授权码/应用密码（非邮箱登录密码）
  password: "uxdrpmvghbffdbbj"
  # SMTP 服务器设置
  smtp:
    server: "smtp.qq.com"
    port: 465
    # 是否使用SSL连接
    use_ssl: true

# ───────────── OctoPrint 配置（可选）─────────────
octoprint:
  # 是否启用 OctoPrint 控制
  enabled: false
  # OctoPrint 服务器地址
  url: "http://192.168.1.100"
  # API 密钥（在OctoPrint设置中获取）
  api_key: "your_api_key_here"

# ───────────── 程序其他设置 ─────────────
app:
  # 程序显示名称
  name: "3D打印异常检测系统"
  # 日志级别 (DEBUG, INFO, WARNING, ERROR)
  log_level: "INFO"